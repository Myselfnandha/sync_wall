[package]
name = "sync_wall_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "sync_wall_core"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["uniffi/cli"]

[features]
default = ["server"]
server = ["dep:axum"]

[dependencies]
uniffi = { version = "0.28", features = ["cli", "tokio"] }
blake3 = "1.5"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
fast_image_resize = "5"
thiserror = "1.0"
uuid = { version = "1.8", features = ["v4", "serde"] }
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["tokio"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "json", "stream"] }
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3.10"
tracing = "0.1"
tracing-subscriber = "0.3"
subtle = "2.5"
kamadak-exif = "0.5"
parking_lot = "0.12"
rand = "0.8"
pem = "3.0"

[dev-dependencies]
tokio = { version = "1.38", features = ["full", "test-util"] }
